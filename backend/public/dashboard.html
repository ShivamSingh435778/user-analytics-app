<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Analytics Dashboard</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
h1{background:#fff;padding:15px;border-radius:8px}
.cards{display:flex;gap:15px;margin:20px 0;flex-wrap:wrap}
.card{background:#fff;padding:20px;border-radius:8px;flex:1;min-width:150px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.card b{font-size:22px;display:block;margin-top:5px}
table{width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1);border-collapse:collapse}
th{background:#2d3748;color:#fff;padding:12px}
td{padding:10px;border-bottom:1px solid #eee;text-align:center;word-break:break-all;font-size:13px}
#heatmap-container{position:relative; width:100%; max-width:900px; height:500px; border:2px solid #333; background:#fff; margin-top:20px; border-radius:8px; overflow:hidden; background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px); background-size:20px 20px;}
.dot{position:absolute; width:14px; height:14px; background:rgba(255,0,0,0.7); border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 8px red;}
</style>
</head>
<body>
<h1>📊 Live Analytics Dashboard</h1>
<button id="clearBtn" style="padding:8px 14px; background:#ff4444; color:white; border:none; border-radius:6px; cursor:pointer; margin-bottom:15px;">🗑️ Clear All Data</button>

<script>
document.getElementById('clearBtn').onclick = async () => {
  if(confirm('Saara data delete kar du?')){
    await fetch('/api/events', { method: 'DELETE' });
    location.reload();
  }
}
</script>
<div class="cards">
<div class="card">Total Sessions<b id="totalSessions">0</b></div>
<div class="card">Total Clicks<b id="totalClicks">0</b></div>
<div class="card">Total Views<b id="totalViews">0</b></div>
<div class="card">Total Events<b id="totalEvents">0</b></div>
</div>
<table>
<thead><tr><th>Session ID</th><th>Clicks</th><th>Page Views</th><th>Time</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>

<h2 style="margin-top:30px;background:#fff;padding:12px;border-radius:8px;">🔥 Click Heatmap (Live)</h2>
<div id="heatmap-container"></div>
<p style="font-size:13px;color:#666;">Red dots = jahan user ne click kiya. Page ko 1920x1080 maan ke scale kiya hai.</p>

<script>
const API_BASE = ''; // same domain pe hai

async function loadData(){
  try{
    const res = await fetch('/api/sessions');
    const sessions = await res.json();
    let totalClicks=0, totalViews=0, totalEvents=0;
    sessions.forEach(s=>{ 
      totalClicks += (s.clicks||0); 
      totalViews += (s.page_views||0);
      totalEvents += (s.total_events||0);
    });
    document.getElementById('totalSessions').innerText = sessions.length;
    document.getElementById('totalClicks').innerText = totalClicks;
    document.getElementById('totalViews').innerText = totalViews;
    document.getElementById('totalEvents').innerText = totalEvents;

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    sessions.forEach(s=>{
      let d = new Date(s.last_activity);
      let timeText = isNaN(d.getTime()) ? 'Just now' : d.toLocaleString('en-IN');
      tbody.innerHTML += `<tr>
        <td style="font-family:monospace;font-size:11px">${s.session_id || 'N/A'}</td>
        <td>${s.clicks||0}</td>
        <td>${s.page_views||0}</td>
        <td>${timeText}</td>
      </tr>`;
    });
  }catch(e){ console.error(e); }
}

async function loadHeatmap(){
  try{
    // tumhara events endpoint /api/events ya /events ho sakta hai - dono try karo
    let res = await fetch('/api/events?limit=200');
    if(!res.ok) res = await fetch('/events?limit=200');
    if(!res.ok) res = await fetch('/api/analytics?limit=200');
    const json = await res.json();
    const events = json.events || json.data || json || [];
    
   const container = document.getElementById('heatmap-container');
container.innerHTML = '';

// --- DENSITY LOGIC START ---
const densityMap = {};
events.forEach(ev => {
  let x = ev.click_x || ev.x || (ev.clickData && ev.clickData.x);
  let y = ev.click_y || ev.y || (ev.clickData && ev.clickData.y);
  if(x==null || y==null) return;
  const key = `${Math.round(x/30)*30}_${Math.round(y/30)*30}`;
  if(!densityMap[key]) densityMap[key] = { x, y, count: 0 };
  densityMap[key].count++;
});

Object.values(densityMap).forEach(p => {
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.left = (p.x/1920*100)+'%';
  dot.style.top = (p.y/1080*100)+'%';
  dot.style.width = (8 + p.count * 4) + 'px';
  dot.style.height = (8 + p.count * 4) + 'px';
  dot.style.background = `rgba(255, ${255 - p.count*40}, 0, ${Math.min(1, 0.35 + p.count*0.2)})`;
  dot.style.borderRadius = '50%';
  dot.style.position = 'absolute';
  dot.title = `${p.count} clicks at ${p.x},${p.y}`;
  container.appendChild(dot);
});
// --- DENSITY LOGIC END ---
  }catch(e){ console.log('heatmap error', e); }
}

loadData();
loadHeatmap();
setInterval(()=>{ loadData(); loadHeatmap(); }, 5000);
</script>
</body>
</html>
